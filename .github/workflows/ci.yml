name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TF_VERSION: "1.14.8"
  TF_IN_AUTOMATION: "true"
  AWS_REGION: ap-northeast-2

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform fmt -check -recursive infra
      - name: terraform validate
        run: |
          for dir in infra/bootstrap infra/envs/dev infra/envs/prod; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

  # dev 는 로컬에서 직접 배포한다 (npm run dev:apply). GitHub 은 prod 만 다룬다.

  # PR: main 에 머지되면 prod 에 생길 변경을 job summary 에 남긴다 (읽기 전용 역할)
  plan-prod:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci && npm run build
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: terraform plan (prod)
        working-directory: infra/envs/prod
        run: |
          terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          terraform plan -input=false -no-color -lock=false \
            -var "app_version=${{ github.sha }}" -out=tfplan
          {
            echo '## terraform plan (prod)'
            echo '```'
            terraform show -no-color tfplan | tail -c 60000
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # main 머지 → prod 배포. GitHub environment "prod" 에 승인자를 지정하면 승인 후 진행.
  deploy-prod:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    uses: ./.github/workflows/deploy.yml
    with:
      environment: prod
    permissions:
      contents: read
      id-token: write
